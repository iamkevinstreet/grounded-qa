[[diagram]]
file = "architecture.svg"
width = 1000
height = 800
title = "Grounded Q&A at a glance"
subtitle = "The model sees only approved passages; the reader sees only claims whose quotes were checked."
caption = "Grey arrows: what moves between parts. Blue: the one path that leaves your machine. Dashed boxes: where each part runs and who may change it."

[[diagram.zone]]
box = [28, 150, 420, 132]
title = "Browser"
rule = "readers and approvers"

[[diagram.component]]
box = [48, 190, 380, 76]
name = "Web app"
details = ["React and TypeScript: ask, sources, approver", "each checked quote highlighted in its passage"]

[[diagram.component]]
box = [612, 170, 360, 80]
name = "Model provider"
details = ["outside your machine: Anthropic by default", "sees the rules, fenced passages, the question"]

[[diagram.zone]]
