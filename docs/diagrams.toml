[[diagram]]
file = "flow.svg"
width = 1000
height = 560
title = "How an answer is made"
subtitle = "A claim reaches the reader only if its quote is found, word for word, in the passage it cites."
caption = "Steps in reading order. Blue: the request that leaves your machine."

[[diagram.component]]
box = [28, 160, 272, 80]
name = "1. Check the question"
details = ["3 to 1,000 characters", "per-client limit, a request id"]

[[diagram.component]]
box = [364, 160, 272, 80]
name = "2. Find passages"
details = ["the 6 best: words, meaning, both", "none found: abstain, no model"]

[[diagram.component]]
box = [700, 160, 272, 80]
name = "3. Fence the passages"
details = ["tagged with id, title, section", "their text is data, not orders"]

[[diagram.component]]
box = [28, 300, 272, 80]
name = "4. Draft with the model"
details = ["JSON: answer, citations, abstain", "one repair turn, then withheld"]

[[diagram.component]]
box = [364, 300, 272, 80]
name = "5. Check every quote"
details = ["word for word, in its passage", "claims that fail are cut"]

[[diagram.component]]
box = [700, 300, 272, 80]
name = "6. Answer or say why not"
details = ["answered, quotes highlighted", "or: not covered, unverified"]

