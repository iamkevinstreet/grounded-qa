########################################################################
#                                                                      #
#                          config/config.toml                          #
#                                                                      #
########################################################################
# Author:            Kevin Street
# Created on:        2026-10-29
# Last modified on:  2026-11-07
#
# Every setting the service, the dashboard and the web app read, at its
# default, and every value two of their files share. No secrets: those
# go in config/.env (copy config/.env.example).
#
# Each key's name is its section and key joined: [retrieval] mode is
# retrieval_mode, and the environment variable RETRIEVAL_MODE overrides
# it. A nested table is one setting: [labels.kinds] is labels_kinds.
# backend/tests/test_config.py keeps this file equal to the defaults in
# backend/src/grounded_qa/config.py and the shared kds settings. The web
# app reads the keys it needs when it is built.

# The model that drafts answers, and how it is called (shared kds settings)
[llm]
provider = "fake"                         # anthropic | openai | azure | fake (offline stand-in)
model = "claude-sonnet-5-5"               # the model that drafts answers
judge_model = "claude-sonnet-5-5"         # unused here: answers are scored by fixed checks
embedding_model = "text-embedding-3-small"  # unused here: embeddings run locally
max_tokens = 2048                         # the most tokens one answer may use
temperature = 0.0                         # 0 keeps runs repeatable
max_retries = 3                           # retries for failures that can succeed later
timeout_s = 60.0                          # how long one model call may take
offline_provider = "fake"                 # the provider that means the offline stand-in

# Only for the azure provider
[azure_openai]
api_version = "2024-10-21"

# The evaluation: its spending limit, planted phrases and case fields
[eval]
budget_usd = 5.0                          # one process stops calling the model past this spend
canaries = ["KESTREL-9", "PINEAPPLE-7"]   # planted in data/samples; no answer may repeat them
answerable_field = "answerable"           # the field of a case that says if the sources answer it

# The service's logs (shared kds settings)
[log]
dir = "logs"                              # one YYYY-MM-DD.jsonl file per day
level = "INFO"                            # DEBUG | INFO | WARNING | ERROR
redact = true                             # remove emails, phone numbers and IDs from logs
trace = false                             # print logger lines as HH:MM:SS traces

# Spans: the timed steps of each question, for Langfuse or any tracing
# tool (shared kds settings, but service and source)
[spans]
keep = false                              # write each evaluation run's spans beside its results
content = false                           # put questions, prompts and answers on spans
public = false                            # let anyone with a trace's link open it in Langfuse
service = "grounded-qa"                   # the name spans are recorded under
source = "approved-sources"               # what a search span says it looked in

# Where spans go once the two Langfuse keys are in config/.env
[langfuse]
base_url = "https://cloud.langfuse.com"   # https://us.cloud.langfuse.com for US data

# The MCP server: the library as tools any MCP client can call
[mcp]
name = "grounded-qa"                      # the server's name, as clients list it
path = "/mcp"                             # where the API serves it over Streamable HTTP
client = "mcp"                            # the name every MCP client's questions count under

# Where the service reads and writes its data, from the repository root
[data]
sources = "data/sources"                  # the approved source documents
samples = "data/samples"                  # synthetic documents only the evaluation adds
cases = "data/evals/cases.jsonl"          # questions with expected answers
results = "data/evals/results"            # where evaluation results are written
audit = "data/generated/audit.sqlite"     # append-only log of source changes
export = "data/export"                    # CSV files for Tableau
figures = "figures.json"                  # the case study's figures, in the results folder

# How passages are cut from the sources and found for a question
[retrieval]
mode = "keyword"                          # keyword (BM25) | semantic | hybrid (needs the local extra)
k = 6                                     # passages shown to the model per question
pool = 50                                 # candidates each ranker passes to fusion
rrf_k = 60                                # reciprocal rank fusion constant
bm25_k1 = 1.2                             # BM25 term-frequency saturation
bm25_b = 0.75                             # BM25 length normalisation
model = "BAAI/bge-small-en-v1.5"          # local embedding model for semantic and hybrid
passage_words = 180                       # the most words in one passage
section_separator = " > "                 # joins a passage's headings; the web app splits on it
keyword_mode = "keyword"                  # the mode that ranks by shared words alone, no model

# What a checked answer may be
[answer]
min_quote_words = 4                       # the shortest quote a citation may give
max_words = 150                           # the longest answer the model may write

# The HTTP service; the web app reads the prefix, the header and the question limits
[api]
host = "127.0.0.1"                        # listen on this machine only
port = 8000
min_question_chars = 3
max_question_chars = 1000
max_source_bytes = 200000                 # the largest document an approver may add
asks_per_minute = 20                      # questions one client may ask per minute
allowed_origins = ["http://localhost:5173"]  # browser origins allowed to call the API
prefix = "/api/v1"                        # the path every route lives under, with its version
request_id_header = "X-Request-ID"        # carries each request's id, the client's or a new one

# How text becomes bytes
[text]
encoding = "utf-8"                        # source files, hashes, sizes, tokens and result files

# Units of time
[time]
ms_per_second = 1000                      # request timings in the logs, trace lines in the web app

# The web app's own settings
[web]
hash_chars = 12                           # how much of a SHA-256 the web app shows

# The evaluation dashboard
[dashboard]
host = "127.0.0.1"                        # this machine only: the dashboard has no sign-in
port = 8050

# The ids of the dashboard's parts, which its layout and its callbacks share.
[dashboard_ids]
url = "url"                               # the location, whose first change reads the scheme
scheme = "scheme"                         # the store that holds the browser's colour scheme
runs = "runs"                             # the run picker
legend = "legend"                         # the runs' key
tiles = "tiles"                           # the headline numbers
outcomes = "outcomes"                     # the chart of how each kind of question ended
retrieval = "retrieval"                   # the retrieval chart
latency = "latency"                       # the time chart
cost = "cost"                             # the cost chart
wrong_table = "wrong-table"               # the table of questions that went wrong

# The column names of the evaluation tables the dashboard draws and the
# Tableau CSV files hold.
[columns]
run_id = "run_id"                         # the run's id: its file name without .json
run = "run"                               # the run's long label
model = "model"                           # the model
mode = "mode"                             # the retrieval mode: keyword, semantic or hybrid
started_at = "started_at"                 # when the run started
kind = "kind"                             # whether a run is live or offline
prices_as_of = "prices_as_of"             # the date of the list prices a run's costs use
case_id = "case_id"                       # the question's id
case_kind = "case_kind"                   # the kind of question, from its tags
outcome = "outcome"                       # how the question ended
latency_ms = "latency_ms"                 # a question's time, in milliseconds
cost_per_case = "cost_per_case_usd"       # a run's cost per question

# The dashboard's charts, which the case study's figures share.
[charts]
light_scheme = "light"                    # the light scheme, which the exported figures use
dark_scheme = "dark"                      # the dark scheme
max_runs = 3                              # the most runs a chart compares: one per ramp step
font_size = 12                            # the size of chart text, in pixels
tick_size = 11                            # the size of value-axis ticks and small notes, in pixels
edge = 8                                  # the margin every chart keeps at its edges, in pixels
clear = "rgba(0,0,0,0)"                   # the colour that lets the card show through
align = "left"                            # titles and notes line up on their left edge
cost_places = 4                           # the decimals a cost is written with
percent_ticks = ".0%"                     # a share axis's ticks: whole percents
outcomes_title = "How each kind of question ended"
retrieval_title = "Retrieval: recall at k and MRR"
latency_title = "Seconds per question"
cost_title = "Cost per question, at list prices"

# How a question can end, as the tables and the charts name each outcome.
[outcomes]
right = "right"                           # answered, with every expected fact
missed = "missed"                         # answered, without every expected fact
refused_wrongly = "refused_wrongly"       # refused, though the sources answer it
refused_rightly = "refused_rightly"       # refused, and the sources do not answer it
should_have_refused = "should_have_refused"  # answered, though the sources do not answer it
failed = "failed"                         # the run could not finish it

# The words people read, shared by the dashboard, the figures and the CSV files.
[labels.kinds]                            # each kind of question, by its tag, in chart order
direct = "Direct"
paraphrased = "Everyday words"
unanswerable = "Unanswerable"
adversarial = "Adversarial"

[labels.outcomes]                         # how a question can end, in the order the chart stacks them
right = "Right"
missed = "Missed a fact"
refused_wrongly = "Refused wrongly"
refused_rightly = "Refused rightly"
should_have_refused = "Should have refused"
failed = "Failed"
