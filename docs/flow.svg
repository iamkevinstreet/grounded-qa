<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc"><title id="title">How an answer is made</title><desc id="desc">A claim reaches the reader only if its quote is found, word for word, in the passage it cites.</desc><defs><marker id="plain" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#a3a3a3"/></marker><marker id="accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5b8def"/></marker></defs><rect width="100%" height="100%" fill="#121212"/><text x="28" y="64" font-family="Georgia, &#x27;Times New Roman&#x27;, serif" fill="#f2f2f2" font-size="44">How an answer is made</text><text x="28" y="100" font-family="-apple-system, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" fill="#f2f2f2" font-size="16" font-weight="700">A claim reaches the reader only if its quote is found, word for word, in the passage it cites.</text><text x="28" y="122" font-family="-apple-system, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" fill="#a3a3a3" font-size="12.5">Steps in reading order. Blue: the request that leaves your machine.</text><rect x="28" y="160" width="272" height="80" rx="8" fill="#1b1b1b" stroke="#3d3d3d" stroke-width="1"/><text x="164" y="184" text-anchor="middle" font-family="-apple-system, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" fill="#f2f2f2" font-size="14" font-weight="700">1. Check the question</text><text x="42" y="204" font-family="-apple-system, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" fill="#a3a3a3" font-size="12.5">3 to 1,000 characters</text><text x="42" y="221" font-family="-apple-system, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" fill="#a3a3a3" font-size="12.5">per-client limit, a request id</text><rect x="364" y="160" width="272" height="80" rx="8" fill="#1b1b1b" stroke="#3d3d3d" stroke-width="1"/><text x="500" y="184" text-anchor="middle" font-family="-apple-system, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" fill="#f2f2f2" font-size="14" font-weight="700">2. Find passages</text><text x="378" y="204" font-family="-apple-system, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" fill="#a3a3a3" font-size="12.5">the 6 best: words, meaning, both</text><text x="378" y="221" font-family="-apple-system, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" fill="#a3a3a3" font-size="12.5">none found: abstain, no model</text><rect x="700" y="160" width="272" height="80" rx="8" fill="#1b1b1b" stroke="#3d3d3d" stroke-width="1"/><text x="836" y="184" text-anchor="middle" font-family="-apple-system, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" fill="#f2f2f2" font-size="14" font-weight="700">3. Fence the passages</text><text x="714" y="204" font-family="-apple-system, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" fill="#a3a3a3" font-size="12.5">tagged with id, title, section</text><text x="714" y="221" font-family="-apple-system, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" fill="#a3a3a3" font-size="12.5">their text is data, not orders</text><rect x="28" y="300" width="272" height="80" rx="8" fill="#1b1b1b" stroke="#3d3d3d" stroke-width="1"/><text x="164" y="324" text-anchor="middle" font-family="-apple-system, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" fill="#f2f2f2" font-size="14" font-weight="700">4. Draft with the model</text><text x="42" y="344" font-family="-apple-system, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" fill="#a3a3a3" font-size="12.5">JSON: answer, citations, abstain</text><text x="42" y="361" font-family="-apple-system, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" fill="#a3a3a3" font-size="12.5">one repair turn, then withheld</text><rect x="364" y="300" width="272" height="80" rx="8" fill="#1b1b1b" stroke="#3d3d3d" stroke-width="1"/><text x="500" y="324" text-anchor="middle" font-family="-apple-system, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" fill="#f2f2f2" font-size="14" font-weight="700">5. Check every quote</text><text x="378" y="344" font-family="-apple-system, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" fill="#a3a3a3" font-size="12.5">word for word, in its passage</text><text x="378" y="361" font-family="-apple-system, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" fill="#a3a3a3" font-size="12.5">claims that fail are cut</text><rect x="700" y="300" width="272" height="80" rx="8" fill="#1b1b1b" stroke="#3d3d3d" stroke-width="1"/><text x="836" y="324" text-anchor="middle" font-family="-apple-system, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" fill="#f2f2f2" font-size="14" font-weight="700">6. Answer or say why not</text><text x="714" y="344" font-family="-apple-system, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" fill="#a3a3a3" font-size="12.5">answered, quotes highlighted</text><text x="714" y="361" font-family="-apple-system, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" fill="#a3a3a3" font-size="12.5">or: not covered, unverified</text><rect x="28" y="440" width="272" height="80" rx="8" fill="#1b1b1b" stroke="#3d3d3d" stroke-width="1"/><text x="164" y="464" text-anchor="middle" font-family="-apple-system, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" fill="#f2f2f2" font-size="14" font-weight="700">Model provider<tspan fill="#a3a3a3" font-weight="400"> (external)</tspan></text><text x="164" y="484" text-anchor="middle" font-family="-apple-system, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" fill="#a3a3a3" font-size="12.5">outside your machine</text><path d="M300 200 L364 200" fill="none" stroke="#a3a3a3" stroke-width="1.2" marker-end="url(#plain)"/><path d="M636 200 L700 200" fill="none" stroke="#a3a3a3" stroke-width="1.2" marker-end="url(#plain)"/><path d="M836 240 L836 270 L164 270 L164 300" fill="none" stroke="#a3a3a3" stroke-width="1.2" marker-end="url(#plain)"/><path d="M300 340 L364 340" fill="none" stroke="#a3a3a3" stroke-width="1.2" marker-end="url(#plain)"/><path d="M636 340 L700 340" fill="none" stroke="#a3a3a3" stroke-width="1.2" marker-end="url(#plain)"/><path d="M164 380 L164 438" fill="none" stroke="#5b8def" stroke-width="2" marker-end="url(#accent)"/><text x="174" y="414" font-family="-apple-system, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" fill="#f2f2f2" font-size="12.5" font-weight="700">prompt out, draft back</text><rect x="336" y="440" width="636" height="80" rx="8" fill="#202020" stroke="#3d3d3d" stroke-width="1"/><text x="350" y="466" font-family="-apple-system, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" fill="#f2f2f2" font-size="14" font-weight="700">Every answer leaves</text><text x="350" y="488" font-family="-apple-system, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" fill="#a3a3a3" font-size="12.5">a JSON log line: request id, outcome, passages, time and cost, no question text</text><text x="350" y="505" font-family="-apple-system, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" fill="#a3a3a3" font-size="12.5">a record the evaluation scores: facts, evidence, citations, abstentions</text></svg>
