########################################################################
#                         config/settings.toml                         #
########################################################################
#  Author:            Kevin Street                                     #
#  Created on:        2026-10-29                                       #
#  Last modified on:  2026-10-29                                       #
#  Purpose:           Every setting the service reads, at its default. #
#                     No secrets: those go in .env.                    #
########################################################################
# Each key's name is its section and key joined: [retrieval] mode is retrieval_mode, and the
# environment variable RETRIEVAL_MODE overrides it. backend/tests/test_config.py keeps this file
# equal to the defaults in backend/grounded_qa/config.py and the shared kds settings.

[llm]
provider = "fake"                         # anthropic | openai | azure | fake (offline stand-in)
model = "claude-sonnet-5-5"               # the model that drafts answers
judge_model = "claude-sonnet-5-5"         # unused here: answers are scored by fixed checks
embedding_model = "text-embedding-3-small"  # unused here: embeddings run locally
max_tokens = 2048                         # the most tokens one answer may use
temperature = 0.0                         # 0 keeps runs repeatable
max_retries = 3                           # retries for failures that can succeed later
timeout_s = 60.0                          # how long one model call may take

[azure_openai]
api_version = "2024-10-21"

[eval]
budget_usd = 5.0                          # one process stops calling the model past this spend
canaries = ["KESTREL-9", "PINEAPPLE-7"]   # planted in data/samples; no answer may repeat them

[log]
dir = "logs"                              # one YYYY-MM-DD.jsonl file per day
level = "INFO"                            # DEBUG | INFO | WARNING | ERROR
redact = true                             # remove emails, phone numbers and IDs from logs
trace = false                             # print logger lines as HH:MM:SS traces

[data]
sources = "data/sources"                  # the approved source documents
samples = "data/samples"                  # synthetic documents only the evaluation adds
cases = "data/evals/cases.jsonl"          # questions with expected answers
results = "data/evals/results"            # where evaluation results are written
audit = "data/generated/audit.sqlite"     # append-only log of source changes

[retrieval]
mode = "keyword"                          # keyword (BM25) | semantic | hybrid (needs the local extra)
k = 6                                     # passages shown to the model per question
pool = 50                                 # candidates each ranker passes to fusion
rrf_k = 60                                # reciprocal rank fusion constant
bm25_k1 = 1.2                             # BM25 term-frequency saturation
bm25_b = 0.75                             # BM25 length normalisation
model = "BAAI/bge-small-en-v1.5"          # local embedding model for semantic and hybrid
passage_words = 180                       # the most words in one passage

[answer]
min_quote_words = 4                       # the shortest quote a citation may give
max_words = 150                           # the longest answer the model may write

[api]
host = "127.0.0.1"                        # listen on this machine only
port = 8000
min_question_chars = 3
max_question_chars = 1000
max_source_bytes = 200000                 # the largest document an approver may add
asks_per_minute = 20                      # questions one client may ask per minute
allowed_origins = ["http://localhost:5173"]  # browser origins allowed to call the API
