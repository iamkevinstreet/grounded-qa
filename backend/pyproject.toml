########################################################################
#                                                                      #
#                        backend/pyproject.toml                        #
#                                                                      #
########################################################################
# Author:            Kevin Street
# Created on:        2026-10-29
# Last modified on:  2026-11-09
#
# Packages the grounded Q&A service and sets ruff, mypy and pytest to
# the code standard.

[project]
name = "grounded-qa"
version = "0.4.2"
description = "Answers employment-law questions from approved sources only, with checked quotes."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "Kevin Street", email = "info@kevindstreet.com" }]
dependencies = [
  "kds-args>=0.6.0,<0.7",
  "kds-settings>=0.6.0,<0.7",
  "kds-logs>=0.6.0,<0.7",
  "kds-llm>=0.6.0,<0.7",
  "kds-evals>=0.6.0,<0.7",
  "fastapi>=0.115",
  "uvicorn>=0.32",
  "mcp>=2.3,<3",
]

[project.optional-dependencies]
# Semantic and hybrid retrieval: a local embedding model, no API key.
local = ["fastembed>=0.4"]
# The evaluation dashboard and the figures and CSV files the case study and Tableau read.
dashboard = ["dash>=3", "plotly>=6", "pandas>=2.2"]

[dependency-groups]
dev = [
  "httpx>=0.28",
  "mypy>=1.13",
  "opentelemetry-sdk>=1.45",
  "pandas-stubs>=2.2",
  "pip-audit>=2.7",
  "pytest>=8.3",
  "ruff==0.17.3",
  "kds-standards>=0.6.0,<0.7",
  "kds-diagrams>=0.6.0,<0.7",
]

# Our own packages come from the utils repository at one reviewed commit; none
# of them is on PyPI, so a same-named public package can never be installed.
[tool.uv.sources]
kds-args = { git = "https://github.com/iamkevinstreet/utils", subdirectory = "args", rev = "6758307bdeca745d04ac4e3f21e5782bca3d12dd" }
kds-settings = { git = "https://github.com/iamkevinstreet/utils", subdirectory = "settings", rev = "6758307bdeca745d04ac4e3f21e5782bca3d12dd" }
kds-logs = { git = "https://github.com/iamkevinstreet/utils", subdirectory = "logs", rev = "6758307bdeca745d04ac4e3f21e5782bca3d12dd" }
kds-llm = { git = "https://github.com/iamkevinstreet/utils", subdirectory = "llm", rev = "6758307bdeca745d04ac4e3f21e5782bca3d12dd" }
kds-evals = { git = "https://github.com/iamkevinstreet/utils", subdirectory = "evals", rev = "6758307bdeca745d04ac4e3f21e5782bca3d12dd" }
kds-standards = { git = "https://github.com/iamkevinstreet/utils", subdirectory = "standards", rev = "6758307bdeca745d04ac4e3f21e5782bca3d12dd" }
kds-diagrams = { git = "https://github.com/iamkevinstreet/utils", subdirectory = "diagrams", rev = "6758307bdeca745d04ac4e3f21e5782bca3d12dd" }

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["grounded_qa*"]

[tool.ruff]
line-length = 99
target-version = "py312"
# isort finds first-party code in src/ (the package) and tests/ (the tests' helpers).
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "BLE", "S", "C90", "PL", "RUF", "G", "D", "ANN"]
# A module's doc block opens with its fields (Author and the dates), not a summary, so the
# summary-first docstring rules do not fit it; kds-standards checks every function's doc block.
ignore = ["D205", "D212", "D415", "ANN401"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-args = 8
max-positional-args = 5

[tool.ruff.lint.isort]
known-first-party = ["grounded_qa"]

[tool.ruff.lint.per-file-ignores]
# Tests assert, repeat expected values inline, and hold made-up tokens.
"tests/**" = ["S101", "S105", "S106", "PLR2004"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Dash registers a pytest plugin for browser tests we do not use; its old-style hooks warn.
addopts = "-q -p no:dash"

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["grounded_qa"]

# fastembed is the optional `local` extra. Where it is installed (CI, and
# anyone who ran `uv sync --extra local`), mypy checks our calls against its
# own types; where it is not, the import is read as untyped instead of failing.
# Plotly and Dash ship no type information at all.
[[tool.mypy.overrides]]
module = ["fastembed", "fastembed.*", "plotly", "plotly.*", "dash", "dash.*"]
ignore_missing_imports = true
